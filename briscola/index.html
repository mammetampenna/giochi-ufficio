<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Briscola</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
<link rel="stylesheet" href="../shared/ui.css">
<style>
  :root { --cw: clamp(78px, 8.6vw, 124px); --ch: calc(var(--cw) * 1.7); --cs: calc(var(--cw) * .5); --felt1: #12604f; --felt2: #0a352d; }
  .card { width: var(--cw); height: var(--ch); border-radius: calc(var(--cw) * .08); position: relative; flex: none; }
  .card svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
  .card.small { width: var(--cs); height: calc(var(--cs) * 1.7); }

  /* niente panno verde: un piano di vetro scuro sopra lo sfondo comune, con un alone del colore della briscola */
  #board { position: fixed; inset: 0; overflow: hidden; --bc: #eab53b; }
  #board::before { content: ''; position: absolute; left: 50%; top: 47%; width: min(70vw, 980px); height: min(58vh, 500px); transform: translate(-50%, -50%);
    border-radius: 36px; background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015)); border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 40px 80px -40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06); backdrop-filter: blur(6px); pointer-events: none; }
  #board::after { content: ''; position: absolute; left: 50%; top: 47%; width: 420px; height: 420px; transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--bc) 22%, transparent), transparent 65%); pointer-events: none; transition: background 1s; }
  #board[data-bris="D"] { --bc: #eab53b; } #board[data-bris="C"] { --bc: #c9302c; } #board[data-bris="S"] { --bc: #4f8fd6; } #board[data-bris="B"] { --bc: #3b8a4c; }
  #board.hidden { display: none; }

  /* giocatori */
  .seat { position: absolute; display: flex; align-items: center; gap: 14px; z-index: 2; }
  .seat[data-pos="top"] { top: 58px; left: 50%; transform: translateX(-50%); }
  .seat[data-pos="left"] { left: 18px; top: 46%; transform: translateY(-50%); flex-direction: column; }
  .seat[data-pos="right"] { right: 18px; top: 46%; transform: translateY(-50%); flex-direction: column; }
  .seat[data-pos="bottom"] { bottom: 16px; left: 22px; }
  .who { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px);
    transition: box-shadow .4s, transform .4s var(--spring); white-space: nowrap; }
  .who .nm { font-weight: 700; font-size: 15px; }
  .who .sub { font-size: 12px; color: var(--dim); }
  .who.turn { box-shadow: 0 0 0 3px var(--acc2), 0 0 30px -4px var(--acc2); transform: scale(1.05); }
  .who .team { width: 10px; height: 10px; border-radius: 50%; }
  .backs { display: flex; height: calc(var(--cs) * 1.7); }
  .backs .card + .card { margin-left: calc(var(--cs) * -.55); }
  .seat[data-pos="left"] .backs, .seat[data-pos="right"] .backs { transform: rotate(90deg); margin: 20px 0; }
  .pile { position: relative; width: var(--cs); height: calc(var(--cs) * 1.7); }
  .pile .card { position: absolute; inset: 0; }
  .pile .n { position: absolute; right: -8px; bottom: -8px; min-width: 24px; height: 24px; border-radius: 12px; background: #fff; color: #17142b; font-size: 12px; font-weight: 800; display: grid; place-items: center; padding: 0 6px; z-index: 2; }
  .pile.empty { opacity: .0; }

  /* mazzo e briscola */
  #deck { position: absolute; left: calc(50% - min(35vw, 490px) + 36px); top: 46%; transform: translateY(-50%); width: var(--cw); height: var(--ch); z-index: 1; }
  #deck .bris { position: absolute; left: 46%; top: 50%; transform: translate(0, -50%) rotate(90deg); transition: opacity .4s; }
  #deck .stack { position: absolute; inset: 0; }
  #deck .stack .card { position: absolute; inset: 0; }
  #deck .count { position: absolute; left: 50%; bottom: -34px; transform: translateX(-50%); font-weight: 800; font-size: 14px; padding: 3px 12px; border-radius: 999px; background: rgba(0,0,0,.35); white-space: nowrap; }
  .chip { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 21; display: flex; align-items: center; gap: 8px; padding: 6px 16px 6px 8px; border-radius: 999px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12); font-weight: 700; }
  .chip svg { width: 26px; height: 26px; }
  .chip.flash { animation: chipFlash 1s var(--spring); }
  @keyframes chipFlash { 30% { transform: translateX(-50%) scale(1.25); box-shadow: 0 0 30px var(--acc2); } }

  /* presa al centro */
  #trick { position: absolute; left: 50%; top: 47%; width: 0; height: 0; z-index: 3; }
  #trick .slot { position: absolute; width: var(--cw); height: var(--ch); margin-left: calc(var(--cw) / -2); margin-top: calc(var(--ch) / -2); }
  .slot[data-pos="bottom"] { transform: translate(0, 32%) rotate(-3deg); }
  .slot[data-pos="top"] { transform: translate(0, -32%) rotate(4deg); }
  .slot[data-pos="left"] { transform: translate(-62%, 0) rotate(-8deg); }
  .slot[data-pos="right"] { transform: translate(62%, 0) rotate(7deg); }
  .duo .slot[data-pos="bottom"] { transform: translate(28%, 6%) rotate(6deg); }
  .duo .slot[data-pos="top"] { transform: translate(-28%, -6%) rotate(-5deg); }
  .slot.win { z-index: 2; }
  .slot.win .card { animation: winPulse .8s var(--spring); }
  .slot.win svg { filter: drop-shadow(0 0 16px rgba(255,210,90,.9)) drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
  @keyframes winPulse { 40% { transform: scale(1.1); } }

  /* la mia mano */
  #hand { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); display: flex; gap: 14px; z-index: 5; padding-bottom: 6px; }
  #hand .card { cursor: pointer; transition: transform .35s var(--spring), opacity .3s; }
  #hand .card:nth-child(1) { transform: rotate(-6deg) translateY(8px); } #hand .card:nth-child(3) { transform: rotate(6deg) translateY(8px); }
  #hand.my .card:hover { transform: translateY(-26px) scale(1.06) !important; }
  #hand:not(.my) .card { cursor: default; }
  #hand.my .card svg { filter: drop-shadow(0 0 0 transparent) drop-shadow(0 10px 18px rgba(0,0,0,.45)); }
  #hand .card .k { position: absolute; left: 50%; bottom: -22px; transform: translateX(-50%); font-size: 11px; color: var(--dim); opacity: 0; transition: opacity .3s; }
  #hand.my .card .k { opacity: 1; }
  .ghost { visibility: hidden; }
  .fly { position: fixed; z-index: 60; pointer-events: none; }

  .banner { position: absolute; left: 50%; bottom: calc(var(--ch) + 56px); transform: translateX(-50%); z-index: 6; padding: 8px 18px; border-radius: 999px; font-weight: 800;
    background: linear-gradient(135deg, var(--acc), var(--acc2)); color: #1a0d14; animation: popIn .4s var(--spring); white-space: nowrap; }
  .toastline { position: absolute; left: 50%; top: calc(46% + var(--ch) * .9); transform: translateX(-50%); z-index: 4; font-weight: 700; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.5); animation: fadeIn .3s; white-space: nowrap; }

  .overlay { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(8,6,18,.55); backdrop-filter: blur(8px); animation: fadeIn .3s; }
  .overlay .modal { width: min(520px, calc(100% - 32px)); text-align: center; }
  .overlay h2 { font-size: 38px; margin: 6px 0 18px; }
  .teams { display: grid; gap: 14px; text-align: left; margin-bottom: 22px; }
  .tm { padding: 12px 16px; border-radius: 16px; background: var(--panel); }
  .tm .row1 { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .tm .row1 b { margin-left: auto; font-size: 30px; font-variant-numeric: tabular-nums; }
  .tm .bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,.08); margin-top: 8px; overflow: hidden; position: relative; }
  .tm .bar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; transition: width 1.6s var(--ease); }
  .tm .bar::after { content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: rgba(255,255,255,.5); }
  .tm.w { box-shadow: 0 0 0 2px var(--ok); }
  .match { color: var(--dim); margin: -6px 0 18px; }
  @media (max-width: 900px) { #deck { left: 30px; } }
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<div id="lobby"></div>
<div id="board" class="hidden">
  <div id="deck"><div class="bris"></div><div class="stack"></div><div class="count"></div></div>
  <div id="trick"></div>
  <div id="seats"></div>
  <div id="hand"></div>
</div>
<div class="chip hidden" id="chip"></div>
<script type="module" src="briscola.js"></script>
</body>
</html>
