<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mazzo piacentino</title>
<link rel="stylesheet" href="../shared/ui.css">
<style>
  body { padding: 80px 24px 40px; }
  h1 { margin: 0 0 20px; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  .c { width: min(110px, calc((100vw - 120px) / 10)); transition: transform .3s var(--spring); filter: drop-shadow(0 8px 14px rgba(0,0,0,.4)); }
  .c:hover { transform: translateY(-10px) scale(1.4); z-index: 2; position: relative; }
  .c svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<h1>Mazzo piacentino</h1>
<div id="deck"></div>
<script type="module">
import { injectDefs, cardSVG, backSVG, SUITS } from '../shared/piacentine.js';
import { mountTopbar } from '../shared/core.js';
mountTopbar();
injectDefs();
// ?c=D9,S8 mostra solo quelle carte, in grande
const only = new URLSearchParams(location.search).get('c');
if (only) document.getElementById('deck').innerHTML = `<div class="row">${only.split(',').map(k => `<div class="c" style="width:230px">${cardSVG({ s: k[0], r: +k.slice(1) })}</div>`).join('')}</div>`;
else document.getElementById('deck').innerHTML = SUITS.map(s => `<div class="row">${Array.from({ length: 10 }, (_, i) => `<div class="c">${cardSVG({ s, r: i + 1 })}</div>`).join('')}</div>`).join('')
  + `<div class="row"><div class="c">${backSVG()}</div></div>`;
</script>
</body>
</html>
