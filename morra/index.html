<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morra calabrese</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤜</text></svg>">
<link rel="stylesheet" href="../shared/ui.css">
<style>
  .game { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: 70px 20px 18px; gap: 10px; }
  .game.hidden { display: none; }

  /* punteggio */
  .score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; width: min(980px, 100%); margin: 0 auto; }
  .pl { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); transition: box-shadow .4s, transform .4s var(--spring); }
  .pl.opp { flex-direction: row-reverse; text-align: right; }
  .pl .info { flex: 1; min-width: 0; }
  .pl .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl .status { font-size: 12px; color: var(--dim); height: 16px; }
  .pl .status.ready { color: var(--ok); }
  .bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--acc), var(--acc2)); transition: width .8s var(--spring); }
  .pl.opp .bar i { margin-left: auto; background: linear-gradient(270deg, var(--acc3), var(--acc4)); }
  .pts { font-size: 40px; font-weight: 800; min-width: 1.4em; text-align: center; font-variant-numeric: tabular-nums; }
  .pts.bump { animation: bump .6s var(--spring); }
  @keyframes bump { 40% { transform: scale(1.6); color: var(--acc2); } }
  .pl.scored { box-shadow: 0 0 0 3px var(--ok), 0 0 40px -6px var(--ok); transform: scale(1.03); }
  .roundinfo { text-align: center; color: var(--dim); font-size: 13px; text-transform: uppercase; letter-spacing: .1em; }
  .roundinfo b { display: block; color: var(--text); font-size: 22px; letter-spacing: 0; text-transform: none; }

  /* arena */
  .arena { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: min(1100px, 100%); margin: 0 auto; min-height: 0; }
  .side { position: relative; display: grid; place-items: center; height: 100%; min-height: 240px; }
  .hand-wrap { width: min(30vh, 260px); aspect-ratio: 200 / 280; }
  .side.left .hand-wrap { transform: rotate(90deg); }
  .side.right .hand-wrap { transform: rotate(-90deg) scaleX(-1); }
  .hand { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 18px 24px rgba(0,0,0,.45)); }
  .hand .sk { fill: #f5c9a3; stroke: #3a2440; stroke-width: 5; stroke-linejoin: round; }
  .hand .fg, .hand .th { transition: transform .45s var(--spring); transform-box: view-box; }
  .hand .fg { transform: scaleY(.42); }
  .hand .fg.up { transform: scaleY(1); }
  .hand .th { transform: rotate(40deg); transform-origin: 54px 190px; }
  .hand .th.up { transform: rotate(-26deg); }
  .hand .f1 { transform-origin: 64.5px 140px; } .hand .f2 { transform-origin: 89.5px 140px; } .hand .f3 { transform-origin: 114.5px 140px; } .hand .f4 { transform-origin: 137.5px 140px; }
  .pumping .hand { animation: pump var(--beat, 1s) var(--ease) infinite; }
  @keyframes pump { 0% { transform: translateY(0); } 35% { transform: translateY(46px) rotate(-3deg); } 70% { transform: translateY(-14px); } 100% { transform: translateY(0); } }
  .thrown .hand { animation: throw .5s var(--spring) forwards; }
  @keyframes throw { from { transform: translateY(40px); } to { transform: translateY(-26px); } }
  .side.winner .hand { filter: drop-shadow(0 0 30px rgba(63,220,138,.8)) drop-shadow(0 18px 24px rgba(0,0,0,.45)); }

  .bubble {
    position: absolute; top: 4%; padding: 10px 20px 12px; border-radius: 22px; background: #fff; color: #17142b; text-align: center;
    transform: scale(0); transition: transform .5s var(--spring); z-index: 2; min-width: 96px;
  }
  .side.left .bubble { left: 18%; border-bottom-left-radius: 6px; }
  .side.right .bubble { right: 18%; border-bottom-right-radius: 6px; background: var(--acc2); }
  .bubble.on { transform: scale(1) rotate(-3deg); }
  .side.right .bubble.on { transform: scale(1) rotate(3deg); }
  .bubble b { display: block; font-size: 44px; line-height: 1; }
  .bubble small { font-weight: 700; font-size: 15px; }
  .bubble.right-call { box-shadow: 0 0 0 4px var(--ok); }

  .center { display: grid; place-items: center; width: 220px; text-align: center; }
  .count { position: relative; width: 140px; height: 140px; display: grid; place-items: center; }
  .count svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .count circle { fill: none; stroke-width: 8; }
  .count .bg { stroke: rgba(255,255,255,.08); }
  .count .fg { stroke: url(#cg); stroke-linecap: round; stroke-dasharray: 402; stroke-dashoffset: 0; }
  .count span { font-size: 64px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .count span.tick { animation: tick .5s var(--spring); }
  @keyframes tick { from { transform: scale(1.5); opacity: .4; } }
  .sum { font-size: 34px; font-weight: 800; min-height: 1.3em; margin-top: 8px; }
  .sum .eq { font-size: 72px; display: block; line-height: 1; background: linear-gradient(135deg, var(--acc), var(--acc2)); -webkit-background-clip: text; background-clip: text; color: transparent; animation: popIn .6s var(--spring); }
  .verdict { font-size: 18px; color: var(--dim); min-height: 1.4em; margin-top: 6px; animation: fadeIn .3s; }

  /* comandi */
  .controls { width: min(760px, 100%); margin: 0 auto; padding: 14px 18px; display: grid; gap: 10px; transition: opacity .3s, transform .4s var(--ease); }
  .controls.off { opacity: .35; pointer-events: none; transform: translateY(8px); }
  .row { display: flex; align-items: center; gap: 8px; }
  .row .lbl { width: 70px; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  .row .opts { display: flex; gap: 8px; flex: 1; }
  .opt {
    flex: 1; height: 54px; border-radius: 16px; font-size: 24px; font-weight: 800; background: var(--panel); border: 1px solid var(--line);
    transition: transform .25s var(--spring), background .2s, opacity .2s, box-shadow .2s;
  }
  .opt:hover { transform: translateY(-3px); background: var(--panel2); }
  .opt.on { background: linear-gradient(135deg, var(--acc), var(--acc2)); color: #1a0d14; transform: translateY(-4px) scale(1.06); box-shadow: 0 10px 24px -8px rgba(255,91,127,.8); border-color: transparent; }
  .opt.dim { opacity: .3; }
  .opt .dots { display: block; font-size: 10px; letter-spacing: 1px; opacity: .6; margin-top: -4px; }
  .keys { text-align: center; font-size: 12px; color: var(--dim); }
  kbd { padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,.1); font-family: inherit; }

  .history { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column-reverse; gap: 4px; font-size: 13px; color: var(--dim); }
  .history div { padding: 4px 10px; border-radius: 10px; background: var(--panel); animation: slideIn .4s var(--spring); }
  .history .w { color: var(--ok); }

  .overlay { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(8,6,18,.55); backdrop-filter: blur(8px); animation: fadeIn .3s; }
  .overlay .modal { text-align: center; width: min(480px, calc(100% - 32px)); }
  .overlay h2 { font-size: 40px; margin: 10px 0; }
  .final { display: flex; justify-content: center; gap: 28px; margin: 18px 0 24px; font-size: 18px; }
  .final b { display: block; font-size: 48px; }
  .intro { font-size: clamp(60px, 12vw, 140px); font-weight: 800; letter-spacing: -.04em; animation: introZoom 1.1s var(--ease) forwards; }
  @keyframes introZoom { 0% { transform: scale(.4); opacity: 0; } 30% { transform: scale(1); opacity: 1; } 80% { opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
  .sound { position: fixed; left: 18px; bottom: 18px; z-index: 21; }
  @media (max-width: 760px) { .center { width: 150px; } .count { width: 110px; height: 110px; } }
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#ff5b7f"/><stop offset="1" stop-color="#ffb23f"/></linearGradient></defs></svg>

<div id="lobby"></div>

<div class="game hidden" id="game">
  <header class="score">
    <div class="pl me" id="plL"></div>
    <div class="roundinfo" id="roundinfo"></div>
    <div class="pl opp" id="plR"></div>
  </header>
  <div class="arena">
    <div class="side left" id="sideL"><div class="bubble"></div><div class="hand-wrap"></div></div>
    <div class="center">
      <div class="count" id="count"><svg viewBox="0 0 140 140"><circle class="bg" cx="70" cy="70" r="64"/><circle class="fg" cx="70" cy="70" r="64"/></svg><span></span></div>
      <div class="sum" id="sum"></div>
      <div class="verdict" id="verdict"></div>
    </div>
    <div class="side right" id="sideR"><div class="bubble"></div><div class="hand-wrap"></div></div>
  </div>
  <div class="controls glass" id="controls">
    <div class="row"><span class="lbl">Dita</span><div class="opts" id="optF"></div></div>
    <div class="row"><span class="lbl">Chiami</span><div class="opts" id="optC"></div></div>
    <div class="keys">Tastiera: prima le dita <kbd>1</kbd>–<kbd>5</kbd>, poi il numero <kbd>2</kbd>–<kbd>9</kbd> (<kbd>0</kbd> = 10). <kbd>⌫</kbd> per ricominciare.</div>
  </div>
  <div class="history" id="history"></div>
</div>
<button class="btn small sound hidden" id="sound" title="Voce e suoni">🔊</button>

<script type="module" src="morra.js"></script>
</body>
</html>
