<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prova voci</title>
<link rel="stylesheet" href="../../shared/ui.css">
<style>
  main { width: min(820px, 100%); margin: 0 auto; padding: 80px var(--gutter) 40px; }
  h1 { margin: 0 0 6px; font-size: 40px; }
  .v { padding: 14px 16px; margin: 12px 0; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); }
  .v b { display: block; font-size: 18px; margin-bottom: 10px; }
  .v div { display: flex; flex-wrap: wrap; gap: 8px; }
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<main>
  <h1>Le grida della morra</h1>
  <p class="hint">Generate con ElevenLabs. A ogni partita ognuno dei due giocatori pesca una di queste quattro voci a caso.</p>
  <div id="list"></div>
</main>
<script>
const W = { 2: 'Dui', 3: 'Tri', 4: 'Quattru', 5: 'Cincu', 6: 'Sei', 7: 'Setti', 8: 'Ottu', 9: 'Novi', 10: 'Tutta' };
const play = f => new Audio('../voci/' + f + '.mp3').play();
document.getElementById('list').innerHTML = [['m', 'Uomo (Nenneri)'], ['f', 'Donna (Giusy, accento siciliano)'], ['a', 'Anziano (pap)'], ['n', 'Anziana (Elettra)']]
  .map(([s, t]) => `<div class="v"><b>${t}</b><div>${Object.entries(W).map(([n, w]) => `<button class="btn small" onclick="play('${s}${n}')">${w}!</button>`).join('')}</div></div>`).join('');
</script>
</body>
</html>
